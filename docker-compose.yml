services:
  db:
    image: postgres:17-alpine
    container_name: invoice-approval-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: invoice_approval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - invoice-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoice_approval"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invoice-db:
